# Transitional stub distribution, see README.rst.
[build-system]
requires = ["setuptools>=68.2,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plone.app.portlets"
version = "8.0.0.dev0"
description = "Empty transitional package, the code moved to plone.portlets. Formerly: Plone-specific portlet user interface and the standard portlets of Plone."
readme = "README.rst"
license = "GPL-2.0-only"
requires-python = ">=3.10"
authors = [
    {name = "Plone Foundation", email = "plone-developers@lists.sourceforge.net"},
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Framework :: Plone",
    "Framework :: Plone :: 6.3",
    "Framework :: Plone :: Core",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
# The lower bound is essential: without it this stub and plone.portlets 4.x
# would be a valid but code-less combination.
dependencies = ["plone.portlets>=5.0.0.dev0"]

[project.urls]
Source = "https://github.com/plone/plone.portlets"
Issues = "https://github.com/plone/Products.CMFPlone/issues"
Changelog = "https://github.com/plone/plone.app.portlets/blob/master/CHANGES.rst"

[tool.setuptools]
packages = []

[tool.towncrier]
directory = "news/"
filename = "CHANGES.rst"
title_format = "{version} ({project_date})"
underlines = ["-", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests:"
showcontent = true
